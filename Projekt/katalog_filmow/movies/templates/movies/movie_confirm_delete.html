{% extends 'movies/base.html' %}

{% block title %}Usuń film{% endblock %}

{% block content %}
    <div class="card">
        <h2>Usuń film</h2>

        <p>
            Czy na pewno chcesz usunąć film:
            <strong>{{ movie.title }}</strong>?
        </p>

        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">Tak, usuń</button>
            <a class="btn btn-secondary" href="{% url 'movie_detail' movie.slug %}">Anuluj</a>
        </form>
    </div>
{% endblock %}
